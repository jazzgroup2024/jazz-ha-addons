name: Auto Update All Zigbee2MQTT Versions

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest Zigbee2MQTT release
        id: get_version
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/Koenkk/zigbee2mqtt/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV
          echo "Latest upstream version: $LATEST_VERSION"

      - name: Update all 30 config.yaml files
        run: |
          for f in zigbee2mqtt-*/config.yaml; do
            sed -i "s/version: .*/version: \"${LATEST_VERSION}\"/" "$f"
          done

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zigbee2mqtt-*/config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update all 30 Zigbee2MQTT instances to ${LATEST_VERSION}" && git push)
